image: node:14.18.1

stages:
  - build
  - test
  - deploy

install dependencies:
  image: node:14.18.1
  stage: build
  cache:
    paths:
      - node_modules/
  only:
    refs:
      - develop
      - staging
      - master
      - feature/cypress-integration
  variables:
    FOLDER: $CI_COMMIT_REF_NAME
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - echo $CI_JOB_STAGE
    - echo $CI_COMMIT_REF_NAME
    - echo $CI_BUILD_REF_NAME
    - npm ci
    - npm run install-styleguide
  artifacts:
    expire_in: 7 days
    paths:
      - node_modules
      - .cache/*
      - cache/Cypress

build site:
  image: node:14.18.1
  stage: build
  cache:
    paths:
      - node_modules/
  only:
    refs:
      - feature/cypress-integration
      - staging
      - master
  variables:
    FOLDER: $CI_COMMIT_REF_NAME
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  script:
    - echo $CI_JOB_STAGE
    - echo $CI_COMMIT_REF_NAME
    - echo $CI_BUILD_REF_NAME
    - if [ "$FOLDER" == "master" ]; then npm run build-prod; fi
    - if [ "$FOLDER" == "staging" ]; then build-stage; fi
    - if [ "$FOLDER" == "feature/cypress-integration" ]; then build-dev; fi
  artifacts:
    expire_in: 1 hour
    paths:
      - dist

deploy_dev:
  image: alpine
  stage: deploy
  only:
    - feature/cypress-integration
  script:
    - apk add --no-cache rsync openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" >> ~/.ssh/id_dsa
    - chmod 600 ~/.ssh/id_dsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - rsync -av --delete --perms --links --verbose --progress dist/ ubuntu@3.124.80.14:/srv/development/brixel-hub

deploy_staging:
  image: alpine
  stage: deploy
  only:
    - staging
  script:
    - apk add --no-cache rsync openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" >> ~/.ssh/id_dsa
    - chmod 600 ~/.ssh/id_dsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - rsync -av --delete --perms --links --verbose --progress dist/ ubuntu@3.124.80.14:/srv/staging/brixel-hub


deploy_master:
  image: alpine
  stage: deploy
  only:
    - master
  script:
    - apk add --no-cache rsync openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" >> ~/.ssh/id_dsa
    - chmod 600 ~/.ssh/id_dsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - rsync -av --delete --perms --links --verbose --progress dist/ ubuntu@3.124.95.1:/srv/production/brixel-hub

test integration:
  image: cypress/browsers:node12.14.1-chrome85-ff81
  stage: test
  variables:
    FOLDER: $CI_COMMIT_REF_NAME
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  except:
    - develop
    - staging
    - master
  script:
    - npm ci
    - rm -rf cypress/videos/ cypress/screenshots/
    - npm run test-cypress
  artifacts:
    when: on_success
    paths:
      - cypress/videos/**/*.mp4
      - cypress/screenshots/**/*.png
    expire_in: 1 day
