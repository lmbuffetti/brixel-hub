stages:
  - build
  - deploy
  - test

# Run the command to create the build for only specific branches
build site:
  image: node:18.15.0
  stage: build
  only:
    refs:
      - SEL-264-Schedule_Visit
      - staging
      - master
  variables:
    FOLDER: $CI_COMMIT_REF_NAME
  script:
    - npm -v;
    - yarn install
    - if [ "$FOLDER" == "SEL-264-Schedule_Visit" ]; then yarn build-dev; fi
    - if [ "$FOLDER" == "staging" ]; then yarn build-stage; fi
    - if [ "$FOLDER" == "master" ]; then yarn build-prod; fi
  artifacts:
    expire_in: 5 days
    paths:
      - dist

# Run the cypress test
test integration:
  image: cypress/browsers:node16.17.1-chrome106-ff105-edge
  stage: test
  only:
    refs:
      - SEL-264-Schedule_Visit
      - staging
      - master
  variables:
    FOLDER: $CI_COMMIT_REF_NAME
  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY")
    - mkdir -p ~/.ssh
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
  when: manual
  script:
    - npm ci
    - rm -rf cypress/videos/ cypress/screenshots/
    - npm run test-cypress
  after_script:
    - mkdir -p ~/.ssh;
    - echo "$SSH_PRIVATE_KEY" >> ~/.ssh/id_dsa;
    - chmod 600 ~/.ssh/id_dsa;
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config;
    - scp -r cypress/ ubuntu@3.124.80.14:/srv/development/brixel-hub/cypress;
    - if [ "$FOLDER" == "SEL-264-Schedule_Visit" ]; then ssh ubuntu@3.124.80.14 'cd /srv/development/brixel-api; export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"; nvm use 16; NODE_ENV=development node scripts/dataManagement/cleanJestTestsData.js delete'; fi
    - if [ "$FOLDER" == "staging" ]; then ssh ubuntu@3.124.80.14 'cd /srv/staging/brixel-api; export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"; nvm use 16; NODE_ENV=staging node scripts/dataManagement/cleanJestTestsData.js delete'; fi
    - if [ "$FOLDER" == "master" ]; then ssh ubuntu@3.124.95.1 'cd /srv/production/brixel-api; export NVM_DIR="$([ -z "${XDG_CONFIG_HOME-}" ] && printf %s "${HOME}/.nvm" || printf %s "${XDG_CONFIG_HOME}/nvm")"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"; nvm use 16; NODE_ENV=production node scripts/dataManagement/cleanJestTestsData.js delete'; fi

# Deploy the build to develop
deploy_dev:
  image: alpine
  stage: deploy
  only:
    - SEL-264-Schedule_Visit
  script:
    - apk add --no-cache rsync openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" >> ~/.ssh/id_dsa
    - chmod 600 ~/.ssh/id_dsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - rsync -av --delete --perms --links --verbose --progress dist/ ubuntu@3.124.80.14:/srv/development/brixel-hub
    - rsync -av --delete --perms --links --verbose --progress cypress/ ubuntu@3.124.80.14:/srv/development/brixel-hub/cypress

# Deploy the build to stage
deploy_staging:
  image: alpine
  stage: deploy
  only:
    - staging
  script:
    - apk add --no-cache rsync openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" >> ~/.ssh/id_dsa
    - chmod 600 ~/.ssh/id_dsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - rsync -av --delete --perms --links --verbose --progress dist/ ubuntu@3.124.80.14:/srv/staging/brixel-hub

# Deploy the build to production
deploy_master:
  image: alpine
  stage: deploy
  only:
    - master
  script:
    - apk add --no-cache rsync openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" >> ~/.ssh/id_dsa
    - chmod 600 ~/.ssh/id_dsa
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - rsync -av --delete --perms --links --verbose --progress dist/ ubuntu@3.124.95.1:/srv/production/brixel-hub
