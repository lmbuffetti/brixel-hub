<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title><%= htmlWebpackPlugin.options.title %></title>
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, shrink-to-fit=no, user-scalable=no"
    />
    <link rel="icon" sizes="192x192" href="/favicon.png">
    <link rel="manifest" href="/manifest.json">

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=<%= htmlWebpackPlugin.options.googleId %>"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '<%= htmlWebpackPlugin.options.googleId %>');
    </script>

    <!-- TRANSIFEX - e86c750b39de4c7e8c36a3b1ab7f98af -->
    <script type="text/javascript" src="//cdn.transifex.com/live.js"></script>
    <script type="text/javascript">window.liveSettings = {
      api_key: '<%= htmlWebpackPlugin.options.transifexKey %>',
      picker: "#transifex-selector",
    };</script>
  </head>
  <body class="txlive">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
