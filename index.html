    <!-- Google Tag Manager -->
    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=<%= htmlWebpackPlugin.options.googleId %>"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', '<%= htmlWebpackPlugin.options.googleId %>');
    </script>
    <!-- End Google Tag Manager -->

    <!-- TRANSIFEX - e86c750b39de4c7e8c36a3b1ab7f98af -->
    <script type="text/javascript" src="//cdn.transifex.com/live.js"></script>
    <script type="text/javascript">window.liveSettings = {
      api_key: '<%= htmlWebpackPlugin.options.transifexKey %>',
      picker: "#transifex-selector",
    };</script>
  </head>
  <body class="txlive">
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe src="https://www.googletagmanager.com/ns.html?id=<%= htmlWebpackPlugin.options.googleId %>"
                      height="0" width="0" style="display:none;visibility:hidden"></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
