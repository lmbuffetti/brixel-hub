on:
  push:
    branches:
      - main
      - BRI-914-2

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # If you wish to fail your job when the Quality Gate is red, uncomment the
      # following lines. This would typically be used to fail a deployment.
      # - uses: sonarsource/sonarqube-quality-gate-action@master
      #   timeout-minutes: 5
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - uses: actions/setup-node@v3
        with:
          node-version: 18.15.0
          registry-url: 'https://npm.pkg.github.com'
          scope: '@brixel-io'
      - run: yarn install
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Print installed version of brixel-components
        run: yarn list --depth=0 | grep @brixel-io/brixel-components
      - run: yarn build-prod
      - uses: actions/upload-artifact@v3
        with:
          name: dist
          path: ./dist
      - uses: actions/upload-artifact@v3
        with:
          name: cypress
          path: ./cypress

  deploy-dev:
    runs-on: ubuntu-latest
    environment: 'DEVELOPMENT'
    needs: build
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          role-duration-seconds: 900
          aws-region: 'eu-central-1'

      - run: aws s3 sync dist/ s3://$(aws s3api list-buckets --output json | jq --raw-output ".Buckets[].Name | select( . | contains(\"website-hub\"))") --delete
      - run: aws cloudfront create-invalidation --distribution-id $(aws cloudfront list-distributions --output json | jq --raw-output ".DistributionList.Items[] | select(.Aliases.Items != null) | select(.Comment | contains(\"hub.brixel.io\" )) | .Id") --paths "/*"

  deploy-staging:
    runs-on: ubuntu-latest
    environment: 'STAGING'
    needs: [ build, deploy-dev ]
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          role-duration-seconds: 900
          aws-region: 'eu-central-1'

      - run: aws s3 sync dist/ s3://$(aws s3api list-buckets --output json | jq --raw-output ".Buckets[].Name | select( . | contains(\"website-hub\"))") --delete
      - run: aws cloudfront create-invalidation --distribution-id $(aws cloudfront list-distributions --output json | jq --raw-output ".DistributionList.Items[] | select(.Aliases.Items != null) | select(.Comment | contains(\"hub.brixel.io\" )) | .Id") --paths "/*"
        # find cloudfront distribution id by alias instead of by comment as soon as its deployed

  deploy-production:
    runs-on: ubuntu-latest
    environment: 'PRODUCTION'
    needs: [ build, deploy-staging ]
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: dist
          path: dist
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE }}
          role-duration-seconds: 900
          aws-region: 'eu-central-1'

      - run: aws s3 sync dist/ s3://$(aws s3api list-buckets --output json | jq --raw-output ".Buckets[].Name | select( . | contains(\"website-hub\"))") --delete
      - run: aws cloudfront create-invalidation --distribution-id $(aws cloudfront list-distributions --output json | jq --raw-output ".DistributionList.Items[] | select(.Aliases.Items != null) | select(.Comment | contains(\"hub.brixel.io\" )) | .Id") --paths "/*"
        # find cloudfront distribution id by alias instead of by comment as soon as its deployed
